<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ut3</title> <!-- creamos una página web básica con la que poder trabajar y realizar las actividades -->
</head>
<body>
    <script> 
        console.log("El ancho de la pantalla es : " +screen.width); // Mostramos el ancho de la pantalla
        console.log("El ancho de la ventana es : " +window.innerWidth); //Mostramos el ancho de la ventana
    </script>

<button id=btn>Pulsar</button>
<p id="mensaje">Cambiamos este texto al pulsar el botón</p>

<script>

    const p = document.getElementById("mensaje");
    document.getElementById("btn").addEventListener("click", function(){
        p.textContent = "El texto ha cambiado";
    });

</script>
</body>
</html>
