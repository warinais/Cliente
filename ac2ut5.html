<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UT5</title>
<style>
    button {
        display: block;
        background-color: lightblue;
        margin: 5px;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        border-radius: 15px;
        color: white;
    }
    button:hover {
        background-color: lightgreen;
    }
</style>
</head>
<body>

<h1>Actividad 2 de la UT5</h1>

<!-- Botones que muestran un mensaje al pulsarlos -->
<button id="boton1">Botón1</button>
<button id="boton2">Botón2</button>
<button id="boton3">Botón3</button>

<!-- Script para manejar los eventos de los botones -->
<script>

    // Funciones que muestran un mensaje en la consola al pulsar cada botón
    function mostrarMensaje1() {
        console.log("¡Has pulsado el botón 1!");
    }
    
    function mostrarMensaje2() {
        console.log("¡Has pulsado el botón 2!");
    }

    function mostrarMensaje3() {
        console.log("¡Has pulsado el botón 3!");
    }

    // Asignación de las fuciones a cada botón
    document.getElementById("boton1").addEventListener("click", mostrarMensaje1);
    document.getElementById("boton2").addEventListener("click", mostrarMensaje2);
    document.getElementById("boton3").addEventListener("click", mostrarMensaje3);

</script>
</body>
</html>
