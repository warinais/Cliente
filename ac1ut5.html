<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UT5</title>
</head>
<body>

<h1>Mi web para la UT5</h1>


    <!-- Botón para cambiar el color de fondo -->
    <button id="boton">Cambia de color el fondo</button>

    <!-- Campo de texto para realizarlo con <p> -->
    <input type="text" id="campoTexto" placeholder="Escribe aquí">
    
    <!--Párrafo donde se ve el texto-->
    <p id="textoMostrado"></p>

    <script>
        let color = 0;
        
        function cambiarColor() {
            if (color == 0) {
                document.body.style.backgroundColor = "lightgreen";
                color = 1;
            } else {
                document.body.style.backgroundColor = "red";
                color = 0;
            }
        }
        
        document.getElementById("boton").onclick = cambiarColor;

        function mostrarTexto() {
            let texto = document.getElementById("campoTexto").value;
            document.getElementById("textoMostrado").textContent = texto;
        }

        document.getElementById("campoTexto").addEventListener("input", mostrarTexto);

    </script>
</body>
</html>
