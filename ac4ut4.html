<script>  

    //Creamos la clase vehículo con atributos privados
    class Vehiculo {
        constructor(marca, velocidad) {
            this.#marca = marca;
            this.#velocidad = velocidad;
        }
        mostrarInfo() {
            return `Marca: ${this.#marca}, Velocidad: ${this.#velocidad}`;
        }
    }




</script>
