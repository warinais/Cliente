<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<script>  

    //Creamos la clase vehículo con atributos privados
    class Vehiculo {
        constructor(marca, velocidad) {
            this.#marca = marca;
            this.#velocidad = velocidad;
        }
        mostrarInfo() {
            return `Marca: ${this.#marca}, Velocidad: ${this.#velocidad}`;
        }
    }

    //Creamos la subclase Coche, con atributo también privado
    class Coche extends Vehiculo {
        constructor(marca, velocidad, puertas) {
            super(marca, velocidad);
            this.#puertas = puertas;
        }
        mostrarInfo() {
            return `${super.mostrarInfo()}, Puertas: ${this.#puertas}`;
        }
    }



</script>

</body>
</html>
