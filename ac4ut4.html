<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<script>  

    //Creamos la clase vehículo con atributos privados
    class Vehiculo {
        constructor(marca, velocidad) {
            this.#marca = marca;
            this.#velocidad = velocidad;
        }

        #marca;
        #velocidad;

        mostrarInfo() {
            return `Marca: ${this.#marca}, Velocidad: ${this.#velocidad}`;
        }

            //Getters && Setters
        get marca() {
            return this.#marca;
        }

        get velocidad() {
            return this.#velocidad;
        }

        set marca(marca) {
            this.#marca = marca;
        }

        set velocidad(velocidad) {
            if (velocidad>=0){
                this.#velocidad = velocidad;
            } else {
                console.log("La velocidad debe ser 0 o más");
            }
        }
    }

    //Creamos la subclase Coche, con atributo también privado
    class Coche extends Vehiculo {
        constructor(marca, velocidad, puertas) {
            super(marca, velocidad);
            this.#puertas = puertas;
        }

        #puertas;

        mostrarInfo() {
            return `${super.mostrarInfo()}, Puertas: ${this.#puertas}`;
        }

        //Getters && Setters

        get puertas() {
            return this.#puertas;
        }

        set puertas(puertas) {
            this.#puertas = puertas;
        }

    }

    //Creamos un objeto y mostramos sus datos
    const coche1 = new Coche("Opel", 150, 5);

    console.log(coche1.mostrarInfo());

</script>

</body>
</html>
