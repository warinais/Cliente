<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<script>  

    //Creamos la clase Figura
    class Figura {
        area(){
            return 0;
        }
    }

    //Creamos la subclase Cuadrado
    class Cuadrado extends Figura {
        constructor(lado) {
            super();
            this.lado = lado;
        }
        area() {
            return this.lado * this.lado;
        }
    }


    //Creamos la subclase Círculo
    class Circulo extends Figura {
        constructor(radio) {
            super();
            this.radio = radio;
        }
        area() {
            return Math.PI * this.radio * this.radio;
        }
    }

    //Creamos varias figuras en una lista

    let figuras = [
        new Cuadrado(5),
        new Circulo(3),
        new Cuadrado(10),
        new Circulo(7),
        new Cuadrado(26),
        new Circulo(12)
    ];

    //Mostramos la lista de figuras
    for (let figura of figuras){
        console.log("Área de la figura: " + figura.area());
    }

</script>

</body>
</html>
